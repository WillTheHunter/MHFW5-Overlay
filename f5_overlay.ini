[General]
; style: lvdew = Lvdew's look (name, numbers, small HP bar)  |  alexander = stacked translucent boxes
style = lvdew
; seconds between memory reads and redraws. 0.03 = about 30 times a second. Lower = faster, 0.01 is the limit
update_time = 0.03
; also list small monsters (Velociprey, Hermitaur ...) below the large ones
show_small_monsters = false
; hide small monsters at 0 HP
hide_dead_small_monsters = true
; show the quest size of large monsters
show_size = true
; write Small / Silver / Gold next to the name when the size is inside the crown range
show_crown = true
; show HP as a percentage
show_hp_percentage = true
; show the maximum HP next to the current HP
show_initial_hp = true
; yellow text / bar (lvdew) or capture colours (alexander) while HP is inside the capture range
highlight_capturable = true
; also highlight large monsters that have no capture range once HP is below this percent (0 = never)
low_hp_percent = 0
; hide the overlay outside quests (in town the game keeps odd entries). It needs at least one known large monster; unknown ids are ignored. Switch off if the overlay stays hidden in a real quest
only_in_quest = true
; show the overlay only while the game window (or this console) is the active window
only_when_focused = false
; hide the overlay for a moment when a screenshot key is pressed (off by default)
hide_on_screenshot = false
; how long it stays hidden after a screenshot key
screenshot_hide_seconds = 2
; screenshot keys, comma separated. Modifiers: Ctrl, Alt, Shift, Win. Keys: PrintScreen, F1-F24, A-Z, 0-9 ...
screenshot_keys = PrintScreen, Alt+PrintScreen, Win+Shift+S
; when started without Administrator rights, ask Windows for them (one UAC prompt) and restart. Needed when the game runs as Administrator
run_as_admin = true
; clear this console window after every menu command so you never have to scroll
clear_screen = true
; console menu: pages (10 commands per page) or all (every option in one list; key 0 switches)
menu_mode = pages
; text art title above the menu
banner = true

[Layout]
; x and y: position as percent of the game window. x = 100, y = 0 is the top-right corner.
; custom = use x and y below. left-center = Lvdew's original place (left side, centered on height). Others: top-left, top-right, bottom-left, bottom-right, right-center
preset = custom
x = 1
y = 50
; extra pixels added to the position (fine tuning)
fix_x = 0
fix_y = 0

[Lvdew]
; Settings for style = lvdew
; text size in points
text_size = 9
; font name (must be installed)
font_family = Segoe UI
font_weight = bold
; HP numbers: below = own line under the name, inline = same line as the name, off = hidden
numbers = below
; draw the HP bar
show_bar = true
; simple = whole bar turns yellow in the capture range; capture = bar stays green and the capture range part of it is painted yellow
bar_mode = simple
; bar length in pixels
bar_width = 180
; bar thickness in pixels
bar_height = 8
; where the bar sits relative to the text of each monster
bar_position = below
; show at most this many monsters
max_rows = 5
; pixels between two monsters
row_gap = 8
; black shadow behind the text (easier to read)
shadow = true
; dark rectangle behind everything
frame = false
frame_color = #000000
; opacity settings (0-100): 0 = not drawn, 100 = solid. Values in between are drawn as a fine dither (Windows cannot blend a single item), so they can look grainy; text itself cannot be made see-through separately, use the overall opacity for that
frame_opacity = 100
; optional box behind each monster (off by default)
box_color = #000000
box_opacity = 0
; colour of the text shadow
shadow_color = #000000
; opacity of the filled part of the bar
bar_opacity = 100
; opacity of the empty part of the bar
bar_back_opacity = 100
; colours: names (white, yellow ...) or #rrggbb
text_color = #FFFFFF
; text colour in the capture range
text_capture_color = #F0F000
bar_color = #10D010
bar_capture_color = #F0F000
; empty part of the bar
bar_back_color = #303030
; opacity of the whole overlay, 0-100
opacity = 100

[Alexander]
; Settings for style = alexander
; text size in pixels
font_size = 18
font_family = Consolas, monaco, monospace
font_weight = bold
; give every box the same width
align = true
; text alignment
orientation = center
; colours: names or #rrggbb
text_color = aquamarine
background_color = #2f4f4f
capture_text_color = yellow
capture_background_color = #1e6b1e
; opacity of the boxes: 0 = no boxes, 100 = solid, in between = dither (see Lvdew section)
background_opacity = 100
capture_background_opacity = 100
; opacity of the whole overlay, 0-100 (Windows cannot fade only the box backgrounds)
window_opacity = 85

[Debug]
; A log file helps when something does not work. Off by default; also switchable with 'i' in the menu
; write the log file
log = true
; relative paths are next to f5_overlay.py
log_file = f5_overlay.log
; debug also logs every change of the monster list
log_level = info

[Crowns]
; Optional overrides in percent of normal size:  Monster name = small_max, silver_min, gold_min
; Velocidrome = 90, 114, 123
